[project]
name = "icevideo"
version = "0.1.0"
description = "Auto-cut highlight reels from long-form video using ffmpeg + Whisper + CLIP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "stable-ts>=2.19",
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python-headless>=4.10",
    "Pillow>=10.0",
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "open-clip-torch>=2.30",
    "ftfy",
    "regex",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Heavier or auth-gated extras. Install with `uv sync --extra <name>`.
faces = ["insightface>=0.7", "onnxruntime>=1.16"]
diarize = ["pyannote.audio>=3.1"]      # also requires HF_TOKEN env var
music = ["librosa>=0.10"]
critique = ["anthropic>=0.39"]          # VLM critique; falls back to heuristic if absent
full = [
    "insightface>=0.7", "onnxruntime>=1.16",
    "pyannote.audio>=3.1",
    "librosa>=0.10",
    "anthropic>=0.39",
]

[project.scripts]
icevideo = "icevideo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["icevideo"]

# By default we pull CPU torch from PyTorch's index so that torch + torchvision
# are guaranteed to match each other (the main reason the standalone v2 attempt
# failed was an ABI mismatch from mixing nightly torch with stable torchvision).
#
# To use CUDA: comment the cpu source below and uncomment one of the cuXXX
# sources, then `uv sync`. The default CPU build is plenty for CLIP and is fine
# for Whisper "base"/"small"; for "turbo"/"large-v3" you'll want CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
# torch = [{ index = "pytorch-cu124" }]
# torchvision = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
